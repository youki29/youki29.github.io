<meta charset="utf-8">
<meta name="robots" content="noindex">
<title>地理総合 2学期中間考査</title>
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=BIZ+UDPGothic:wght@400;700&family=BIZ+UDPMincho:wght@400;700&family=Klee+One:wght@600&family=IBM+Plex+Mono:wght@500&display=swap">
<style>
/* Layout: 1枚の答案用紙を大問ごとの「用紙」に分け、上に固定の採点バー。赤ペンで丸つけ */
:root{
  --bg:#e8edf0;
  --paper:#ffffff;
  --plate:#ffffff;      /* スキャン図版の台紙 */
  --ink:#1b2a33;
  --muted:#5f707a;
  --line:#cfd8dd;
  --soft:#f1f5f7;
  --accent:#24597a;     /* 選択肢の青 */
  --accent-soft:#dde9f0;
  --red:#d2352a;        /* 赤ペン */
  --red-soft:#fbe3e0;
  --ok-soft:#e1f0e6;
  --f-q:"BIZ UDPMincho","Hiragino Mincho ProN","Yu Mincho",serif;
  --f-ui:"BIZ UDPGothic","Hiragino Sans","Yu Gothic",sans-serif;
  --f-pen:"Klee One","Hiragino Maru Gothic ProN",cursive;
  --f-mono:"IBM Plex Mono",ui-monospace,Menlo,monospace;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#11191e;--paper:#1a252c;--plate:#e6eaec;--ink:#e4ecf0;--muted:#97a8b1;--line:#30414b;--soft:#22313a;
  --accent:#8cc0de;--accent-soft:#213a4a;--red:#ff7a6c;--red-soft:#43231f;--ok-soft:#1f3a2a;color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#11191e;--paper:#1a252c;--plate:#e6eaec;--ink:#e4ecf0;--muted:#97a8b1;--line:#30414b;--soft:#22313a;
  --accent:#8cc0de;--accent-soft:#213a4a;--red:#ff7a6c;--red-soft:#43231f;--ok-soft:#1f3a2a;color-scheme:dark}

*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font-family:var(--f-ui);font-size:15px;line-height:1.8;
  padding-left:max(12px,env(safe-area-inset-left,0px));padding-right:max(12px,env(safe-area-inset-right,0px));padding-block:0 80px}
@media (min-width:600px){body{padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}}
.wrap{max-width:860px;margin:0 auto}
button{font:inherit;color:inherit;cursor:pointer}
button:focus-visible,input:focus-visible{outline:2px solid var(--accent);outline-offset:2px}

/* Bar */
.bar{position:sticky;top:env(safe-area-inset-top,0px);z-index:10;background:var(--bg);padding-block:10px;border-bottom:1px solid var(--line);
  display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.bar .t{font-weight:700;font-size:14px;margin-right:auto;min-width:0}
.bar .t small{display:block;font-family:var(--f-mono);font-size:11px;color:var(--muted);font-weight:500}
.btn{border:1px solid var(--line);background:var(--paper);border-radius:8px;padding:7px 14px;font-weight:700;font-size:13px}
.btn.primary{background:var(--red);border-color:var(--red);color:#fff}
.btn[aria-pressed="true"]{background:var(--ink);color:var(--paper);border-color:var(--ink)}
.idx{display:flex;gap:4px;overflow-x:auto;scrollbar-width:none;width:100%}
.idx::-webkit-scrollbar{display:none}
.idx a{flex:none;width:32px;height:30px;display:grid;place-items:center;border:1px solid var(--line);border-radius:6px;
  background:var(--paper);color:var(--ink);text-decoration:none;font-family:var(--f-mono);font-size:12px}
.idx a.done{border-color:var(--accent);color:var(--accent)}

/* Cover */
.cover{background:var(--paper);border-radius:12px;margin-top:20px;padding:24px clamp(16px,4vw,32px);display:grid;gap:10px}
.cover h1{margin:0;font-family:var(--f-q);font-size:clamp(24px,5vw,34px);line-height:1.3;text-wrap:balance}
.cover .meta{display:flex;flex-wrap:wrap;gap:6px 18px;font-size:13px;color:var(--muted)}
.cover p{margin:0;font-size:14px;color:var(--muted);max-width:62ch}
.score{display:none;align-items:baseline;gap:10px;font-family:var(--f-pen);color:var(--red)}
body.graded .score{display:flex}
.score .n{font-size:56px;line-height:1}
.score .d{font-size:20px}

/* Question sheet */
.sheet{background:var(--paper);border-radius:12px;margin-top:18px;padding:22px clamp(14px,4vw,32px);scroll-margin-top:110px}
.sh{display:flex;gap:12px;align-items:flex-start}
.no{flex:none;border:1.5px solid var(--ink);width:34px;height:34px;display:grid;place-items:center;font-family:var(--f-mono);font-size:17px;margin-top:2px}
.lead{font-family:var(--f-q);font-size:16px;margin:0;min-width:0}
.pts{display:inline-block;font-family:var(--f-ui);font-size:12px;color:var(--muted);border:1px solid var(--line);border-radius:4px;padding:0 6px;margin-left:4px;white-space:nowrap}
.body{display:grid;gap:18px;margin-top:16px}
.qtext{font-family:var(--f-q);font-size:15.5px;margin:0}
.stmts{list-style:none;margin:6px 0 0;padding:10px 14px;background:var(--soft);border-radius:8px;font-family:var(--f-q);font-size:15px;display:grid;gap:4px}
.stmts li{display:flex;gap:8px}
.stmts li b{font-family:var(--f-mono);font-weight:500;color:var(--muted);flex:none;width:2.6em}

/* Figures */
.figs{display:flex;flex-wrap:wrap;gap:12px;align-items:flex-end}
figure{margin:0;background:var(--plate);border:1px solid var(--line);border-radius:6px;padding:6px;max-width:100%}
figure img{display:block;height:auto;max-width:100%}
figcaption{font-size:12px;color:#55636b;text-align:center;font-family:var(--f-ui)}
.fig-l img{width:560px}.fig-m img{width:380px}.fig-s img{width:220px}.fig-xs img{width:150px}

/* Tables */
.tw{overflow-x:auto;max-width:100%}
table{border-collapse:collapse;font-size:14px;font-family:var(--f-q)}
th,td{border:1px solid var(--line);padding:4px 10px;text-align:center;white-space:nowrap}
th{background:var(--soft);font-family:var(--f-ui);font-weight:700}
.tf td{font-family:var(--f-ui);min-width:34px}
.tf td.o{color:var(--accent);font-weight:700}

/* Parts / answers */
.part{display:grid;gap:8px;padding-top:14px;border-top:1px dashed var(--line);position:relative}
.part .lab{font-family:var(--f-q);font-size:15.5px;min-width:0}
.part .lab b{font-family:var(--f-ui);color:var(--accent);margin-right:6px}
.opts{display:flex;flex-wrap:wrap;gap:6px}
.opts button{border:1px solid var(--line);background:var(--paper);border-radius:8px;min-width:42px;padding:5px 12px;font-size:14.5px;text-align:left}
.opts button:hover{border-color:var(--accent)}
.opts button[aria-pressed="true"]{background:var(--accent);border-color:var(--accent);color:var(--paper);font-weight:700}
.opts.col{flex-direction:column;align-items:stretch}
.inp{display:flex;align-items:center;gap:6px;flex-wrap:wrap}
.inp input{font:inherit;font-size:16px;border:1px solid var(--line);border-bottom:2px solid var(--ink);background:var(--paper);color:var(--ink);
  padding:4px 10px;border-radius:6px 6px 0 0;width:min(240px,100%)}
.inp span{font-family:var(--f-q)}
.mark{position:absolute;right:0;top:4px;font-family:var(--f-pen);color:var(--red);font-size:40px;line-height:1;display:none;pointer-events:none}
body.graded .mark,body.reveal .mark{display:block}
body.reveal:not(.graded) .mark{display:none}
.key{display:none;font-size:13.5px;background:var(--red-soft);border-radius:8px;padding:8px 12px;max-width:66ch}
.key .c{font-family:var(--f-pen);color:var(--red);font-size:18px;margin-right:8px}
body.graded .key,body.reveal .key{display:block}
.part.right .key{background:var(--ok-soft)}

.grid2{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,300px),1fr));gap:16px}
.grid2>*{min-width:0}

/* Q10 diagram */
.dg{display:flex;flex-wrap:wrap;gap:14px;align-items:flex-start;font-size:13.5px}
.dg .box{border:1px solid var(--ink);padding:8px 10px;border-radius:2px;background:var(--paper)}
.dg .box h4{margin:0 0 4px;font-size:12.5px;font-weight:700}
.dg .row{display:flex;gap:6px;align-items:center;padding:2px 0}
.dg .k{border:1px solid var(--ink);width:24px;height:22px;display:grid;place-items:center;font-family:var(--f-mono);flex:none}
.dg svg text{fill:var(--ink);font-family:var(--f-mono);font-size:13px}
.dg svg .ln{stroke:var(--ink);fill:none;stroke-width:1.2}
.dg svg .bx{fill:var(--paper);stroke:var(--ink)}

/* Q4 chart */
.chart{width:100%;max-width:440px}
.chart text{fill:var(--ink);font-family:var(--f-ui);font-size:12px}
.chart .ax{fill:var(--muted);font-size:10px;font-family:var(--f-mono)}
.chart .sA{fill:#9aa6ad}.chart .sI{fill:var(--paper);stroke:var(--ink)}.chart .sU{fill:var(--paper);stroke:var(--ink)}.chart .sW{fill:var(--paper);stroke:var(--ink)}
.chart .gl{stroke:var(--line)}

footer{margin-top:28px;font-size:12px;color:var(--muted);text-align:center}
@media (max-width:480px){
  .mark{font-size:32px}.lead{font-size:15px}
  .bar{gap:6px;padding-block:8px}
  .bar .t{font-size:13px;flex:1 1 auto}
  .btn{padding:6px 9px;font-size:12px}
  .idx a{width:30px;height:28px}
  .sheet{scroll-margin-top:96px}
  .opts button{min-width:44px;min-height:40px}
  .figs figure{flex:1 1 40%}
  .figs figure.fig-m,.figs figure.fig-l{flex-basis:100%}
  .figs figure img{width:100%}
}
</style>

<div class="wrap">
  <div class="bar">
    <div class="t">地理総合 中間考査<small id="prog">回答 0 / 0</small></div>
    <button class="btn" id="b-reset">リセット</button>
    <button class="btn" id="b-key" aria-pressed="false">解答を見る</button>
    <button class="btn primary" id="b-grade">採点する</button>
    <nav class="idx" id="idx" aria-label="大問へ移動"></nav>
  </div>

  <div class="cover">
    <div class="meta"><span>地理総合 2025</span><span>2学期中間考査</span><span>1年</span><span>100点満点</span></div>
    <h1>人種・民族・宗教・言語と世界の地域</h1>
    <p>選択問題はボタンを押し、記述問題は入力欄に書き込みます。最後に「採点する」を押すと赤ペンで丸つけされ、正解と解説が表示されます。入力した答えはこのブラウザに保存されます。</p>
    <div class="score"><span class="n" id="sc">0</span><span class="d">/ 100点</span><span class="d" id="sc2"></span></div>
  </div>

  <main id="main"></main>
  <footer>問題は試験用紙をもとに再構成しています。図版は元の用紙から切り出したものです。</footer>
</div>

<script>
/* ---------- helpers ---------- */
const TF8=[["○","○","○"],["○","○","×"],["○","×","○"],["×","○","○"],["○","×","×"],["×","○","×"],["×","×","○"],["×","×","×"]];
const tf8Table=()=>`<div class="tw"><table class="tf"><tr><th></th>${TF8.map((_,i)=>`<th>${i+1}</th>`).join("")}</tr>${["i","ii","iii"].map((r,ri)=>`<tr><th>${r}</th>${TF8.map(c=>`<td class="${c[ri]==="○"?"o":""}">${c[ri]}</td>`).join("")}</tr>`).join("")}</table></div>`;
const stm=(arr,marks)=>`<ul class="stmts">${arr.map((s,i)=>`<li><b>${(marks||["i)","ii)","iii)"])[i]}</b><span>${s}</span></li>`).join("")}</ul>`;
const fig=(src,cls,cap)=>`<figure class="${cls}"><img src="img/${src}.jpg" alt="${cap||""}" loading="lazy">${cap?`<figcaption>${cap}</figcaption>`:""}</figure>`;
const nums=n=>Array.from({length:n},(_,i)=>String(i+1));
const kana=s=>s.split("");
/* part: {id,lab,type:'c'|'t',opts,ans,acc,suf,pts,note,col} */
const C=(id,lab,opts,ans,pts,note,col)=>({id,lab,type:"c",opts,ans,pts,note,col});
const T=(id,lab,acc,pts,note,suf)=>({id,lab,type:"t",acc:[].concat(acc),pts,note,suf});
const TF=(id,lab,stmts,ans,note)=>C(id,`${lab}${stm(stmts)}`,nums(8),String(ans),2,note);

/* ---------- questions ---------- */
const Q=[
{no:1,lead:"次の地図の A〜D の地域の人種について次の設問に答えよ。",
 body:fig("q1-world","fig-m"),
 parts:[
  {html:`<p class="qtext">① 15世紀以前 A〜D の地域に分布していた人種を、学術名「<u>〜イド</u>」で答えよ。<span class="pts">知識×1点</span></p>`},
  T("1a","A",["オーストラロイド"],1,"オーストラリアの先住民（アボリジニ）。","イド"),
  T("1b","B",["ネグロイド"],1,"アフリカ中南部。","イド"),
  T("1c","C",["コーカソイド"],1,"ヨーロッパ。","イド"),
  T("1d","D",["モンゴロイド"],1,"東アジア。","イド"),
  {html:`<p class="qtext">② 15世紀以前と今日の地球上の分布と比べたとき、その間の分布の変化について述べた次の i)〜iii) の文章の正誤について正しい組み合わせのものを表の 1〜8 の中から1つ選べ。<span class="pts">思考×2点</span></p>`+tf8Table()},
  TF("1e","",["A の分布域が主に南北アメリカ大陸で拡大した。","C の分布域が主に南北アメリカ大陸で拡大した。","B の分布域が主にヨーロッパ地域で縮小した。"],6,"i ×・ii ○・iii ×。南北アメリカに広がったのは C（移民）と B（奴隷貿易）。B はもともとヨーロッパにいない。")
 ]},
{no:2,lead:"今から1万年前までには、Homo sapiens は一部の地域を除く地球のほぼ全域に広がっていたと考えられる。これについての設問に答えよ。",
 parts:[
  {html:`<p class="qtext">① Homo sapiens の拡散について述べた次の i)〜iii) の文章の正誤について正しい組み合わせのものを下の表の 1〜8 の中から1つ選べ。<span class="pts">思考×2点</span></p>`+tf8Table()},
  TF("2a","",["Homo sapiens の起源はアフリカ大陸中部であると考えられている。","ユーラシア大陸に進出した Homo sapiens の中で、ヨーロッパ系人種となっていく集団は、カスピ海と黒海の間の地域に起源を持つとされている。","アジア系人種が北アメリカ大陸に進出することができたのは、氷期による海面低下にともなってユーラシア大陸と北アメリカ大陸が陸続きであったためである。"],1,"すべて ○。起源は厳密には東アフリカだが、この問題では ○ 扱い。"),
  T("2b",`② ヨーロッパ系人種の学術名〜イドの語源となった山脈は、<u>現地語</u>で何山脈と呼ばれるか。<span class="pts">知識×1点</span>`,["カフカス"],1,"英語読みはコーカサス（コーカソイドの語源）。黒海とカスピ海の間。","山脈"),
  T("2c",`③ 現在ユーラシア大陸と北アメリカ大陸との間にある海峡名を答えよ。<span class="pts">知識×1点</span>`,["ベーリング"],1,"氷期は陸続き（ベーリンジア）だった。","海峡")
 ]},
{no:3,lead:"ヨーロッパの3つの民族と3つの宗教宗派についての次の表についての問いに答えよ。",
 body:`<div class="grid2">${fig("q3-europe","fig-m")}<div class="tw"><table><tr><th></th><th>プロテスタント</th><th>カトリック</th><th>正教会</th></tr><tr><th>ゲルマン</th><td>A</td><td>D</td><td>G</td></tr><tr><th>ラテン</th><td>B</td><td>E</td><td>H</td></tr><tr><th>スラブ</th><td>C</td><td>F</td><td>I</td></tr></table></div></div>`,
 parts:[
  {html:`<p class="qtext">① 地図中 <b>あ〜か</b> の国の多数派の民族と宗派の組み合わせを上の表の A〜I の中から選べ。<span class="pts">知識×1点</span></p>`},
  ...[["あ","A","ノルウェー・スウェーデン：ゲルマン×プロテスタント。"],["い","I","ロシア：スラブ×正教会。"],["う","F","ポーランド：スラブ×カトリック。"],["え","H","ルーマニア：ラテン×正教会。ラテン系なのに正教の例外。"],["お","D","オーストリア：ゲルマン×カトリック。"],["か","E","スペイン：ラテン×カトリック。"]]
    .map(([k,a,n])=>C("3"+k,k,kana("ABCDEFGHI"),a,1,n)),
  {html:`<p class="qtext">② 上の表に関する次の質問に答えよ。<span class="pts">思考×1点</span></p>`},
  C("3x","i) それぞれの民族で最も多い組み合わせを下のア)〜キ)から一つ選べ",["ア) AEH","イ) AEI","ウ) BDH","エ) BCG","オ) BFI","カ) CEG","キ) CDG"],"イ) AEI",1,"ゲルマン→プロテスタント(A)、ラテン→カトリック(E)、スラブ→正教(I)。"),
  C("3y","ii) ほぼあり得ない組み合わせを下のア)〜キ)から一つ選べ",["ア) AEH","イ) AEI","ウ) BDH","エ) BCG","オ) BFI","カ) CEG","キ) CDG"],"エ) BCG",1,"ラテンのプロテスタント、スラブのプロテスタント、ゲルマンの正教。")
 ]},
{no:4,lead:"次のグラフは地図中のいずれかの国で信仰されている宗教について、宗教別の人口の割合を示したものである。グラフ中のア〜ウはイスラーム・ヒンドゥー・仏教のいずれかであり、下の写真(イラスト)のア〜ウはそれらの宗教に関するものである。①〜③に該当する国名の組み合わせとして正しいものを下の表の A〜F の中から1つ選べ。",pts:"思考×2点",
 body:`<div class="grid2">${fig("q4-map","fig-s")}<div id="chart"></div></div>
  <div class="figs">${fig("q4-a","fig-s","ア")}${fig("q4-i","fig-xs","イ")}${fig("q4-u","fig-s","ウ")}</div>
  <div class="tw"><table><tr><th></th><th>①</th><th>②</th><th>③</th></tr>${[["A","インド","バングラデシュ","スリランカ"],["B","インド","スリランカ","バングラデシュ"],["C","バングラデシュ","インド","スリランカ"],["D","バングラデシュ","スリランカ","インド"],["E","スリランカ","インド","バングラデシュ"],["F","スリランカ","バングラデシュ","インド"]].map(r=>`<tr><th>${r[0]}</th><td>${r[1]}</td><td>${r[2]}</td><td>${r[3]}</td></tr>`).join("")}</table></div>`,
 parts:[C("4a","①〜③の国名の組み合わせ",kana("ABCDEF"),"F",2,"パキスタンがほぼイ一色なので イ＝イスラーム。ア＝ヒンドゥー（ガンジス川の沐浴）、ウ＝仏教（托鉢）。① 仏教7割＝スリランカ、② イスラーム9割＝バングラデシュ、③ ヒンドゥー8割＝インド。")]},
{no:5,lead:"次の写真(イラスト)はいずれかの宗教(宗派)の聖地(重要都市)である。それぞれの<u>都市名</u>を答えよ。",pts:"知識×1点",
 body:`<div class="figs">${fig("q5-1","fig-s","①")}${fig("q5-2","fig-xs","②")}${fig("q5-3","fig-s","③")}</div>`,
 parts:[T("5a","①",["メッカ","マッカ"],1,"カーバ神殿。イスラーム最大の聖地。"),T("5b","②",["エルサレム"],1,"嘆きの壁。ユダヤ教の聖地。"),T("5c","③",["ローマ","バチカン"],1,"サン・ピエトロ大聖堂（バチカン市国）。カトリックの総本山。")]},
{no:6,lead:"次の写真(イラスト)①〜③の宗教施設は下の選択肢ア〜オのうちいずれのものか。ア〜オの記号で答えよ。",pts:"知識×1点",
 body:`<div class="figs">${fig("q6-1","fig-s","①")}${fig("q6-2","fig-s","②")}${fig("q6-3","fig-s","③")}</div>`,

/* ---------- render ---------- */
const KEY="chiri-midterm-test-v1";
let ans={};try{ans=JSON.parse(localStorage.getItem(KEY)||"{}")||{}}catch(e){}
const save=()=>{try{localStorage.setItem(KEY,JSON.stringify(ans))}catch(e){}};
const esc=s=>String(s).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const parts=[];
const main=document.getElementById("main"),idx=document.getElementById("idx");

Q.forEach(q=>{
  idx.insertAdjacentHTML("beforeend",`<a href="#s${q.no}" data-s="${q.no}">${q.no}</a>`);
  const html=q.parts.map(p=>{
    if(p.html)return p.html;
    p.sec=q.no;parts.push(p);
    const input=p.type==="c"
      ?`<div class="opts${p.col?" col":""}">${p.opts.map(o=>`<button type="button" data-v="${esc(o)}" aria-pressed="${ans[p.id]===o}">${esc(o)}</button>`).join("")}</div>`
      :`<div class="inp"><input id="in-${p.id}" type="text" autocomplete="off" value="${esc(ans[p.id]||"")}" aria-label="解答">${p.suf?`<span>${p.suf}</span>`:""}</div>`;
    const correct=p.type==="c"?p.ans:p.acc[0]+(p.suf||"");
    return `<div class="part" data-id="${p.id}"><div class="lab">${p.lab?(p.type==="c"&&!p.lab.includes("<ul")&&!p.lab.startsWith("(")&&!p.lab.startsWith("問")&&p.lab.length<4?`<b>${p.lab}</b>`:p.lab):""}</div>${input}
      <span class="mark" aria-hidden="true"></span>
      <div class="key"><span class="c">${esc(correct)}</span>${esc(p.note||"")}</div></div>`;
  }).join("");
  main.insertAdjacentHTML("beforeend",`<section class="sheet" id="s${q.no}">
    <div class="sh"><span class="no">${q.no}</span><p class="lead">${q.lead}${q.pts?`<span class="pts">${q.pts}</span>`:""}</p></div>
    <div class="body">${q.body||""}${html}</div></section>`);
});

/* Q4 chart (読み取った割合) */
(()=>{
  const rows=[["パキスタン",[["W",2,""],["I",98,"イ"]]],["①",[["A",13,"ア"],["U",64,"ウ"],["W",23,""]]],["②",[["A",8,"ア"],["I",92,"イ"]]],["③",[["A",80,"ア"],["I",14,"イ"],["W",6,""]]]];
  const X0=64,W=280,H=26,G=12;let y=8,s="";
  for(let p=0;p<=100;p+=10){const x=X0+W*p/100;s+=`<line class="gl" x1="${x}" x2="${x}" y1="4" y2="${8+rows.length*(H+G)-G+4}"/><text class="ax" x="${x}" y="${8+rows.length*(H+G)+8}" text-anchor="middle">${p}%</text>`}
  rows.forEach(([lab,segs])=>{let x=X0;s+=`<text x="${X0-8}" y="${y+H/2+4}" text-anchor="end">${lab}</text>`;
    segs.forEach(([k,v,t])=>{const w=W*v/100;s+=`<rect class="s${k}" x="${x}" y="${y}" width="${w}" height="${H}"/>`;if(t)s+=`<text x="${x+w/2}" y="${y+H/2+4}" text-anchor="middle">${t}</text>`;x+=w});y+=H+G});
  document.getElementById("chart").innerHTML=`<svg class="chart" viewBox="0 0 ${X0+W+10} ${y+20}" role="img" aria-label="宗教別人口割合のグラフ">${s}</svg>`;
})();

/* ---------- interaction ---------- */
const prog=document.getElementById("prog");
const answered=p=>!!(ans[p.id]&&String(ans[p.id]).trim());
function updProg(){
  prog.textContent=`回答 ${parts.filter(answered).length} / ${parts.length}`;
  Q.forEach(q=>{const ps=parts.filter(p=>p.sec===q.no);idx.querySelector(`[data-s="${q.no}"]`).classList.toggle("done",ps.every(answered))});
}
main.addEventListener("click",e=>{
  const b=e.target.closest(".opts button");if(!b)return;
  const part=b.closest(".part"),id=part.dataset.id;
  ans[id]=ans[id]===b.dataset.v?"":b.dataset.v;
  part.querySelectorAll(".opts button").forEach(x=>x.setAttribute("aria-pressed",x.dataset.v===ans[id]));
  save();updProg();if(document.body.classList.contains("graded"))grade();
});
main.addEventListener("input",e=>{
  if(!e.target.matches(".inp input"))return;
  ans[e.target.closest(".part").dataset.id]=e.target.value;save();updProg();
});

const kata=s=>s.replace(/[ぁ-ゖ]/g,c=>String.fromCharCode(c.charCodeAt(0)+0x60));
const norm=(s,suf)=>{let t=kata(String(s||"").normalize("NFKC")).replace(/[\s　()（）「」]/g,"").replace(/ー+/g,"ー");
  if(suf&&t.endsWith(suf))t=t.slice(0,-suf.length);
  t=t.replace(/(語|語圏|山脈|海峡|高原|湾|海|大陸|イド|か国|カ国)$/,m=>m===t?m:"");return t};
function isRight(p){
  if(p.type==="c")return ans[p.id]===p.ans;
  const v=norm(ans[p.id],p.suf);if(!v)return false;
  return p.acc.some(a=>norm(a,p.suf)===v);
}
function grade(){
  let score=0,n=0;
  parts.forEach(p=>{const ok=isRight(p);if(ok){score+=p.pts;n++}
    const el=main.querySelector(`.part[data-id="${p.id}"]`);el.classList.toggle("right",ok);el.querySelector(".mark").textContent=ok?"○":"✓";
    el.querySelector(".mark").style.opacity=ok?1:.9;});
  document.getElementById("sc").textContent=score;
  document.getElementById("sc2").textContent=`（${n}/${parts.length}問正解）`;
}
document.getElementById("b-grade").onclick=()=>{grade();document.body.classList.add("graded");document.querySelector(".cover").scrollIntoView({behavior:"smooth"})};
const kb=document.getElementById("b-key");
kb.onclick=()=>{const on=kb.getAttribute("aria-pressed")!=="true";kb.setAttribute("aria-pressed",on);document.body.classList.toggle("reveal",on)};
let armed=false;const rb=document.getElementById("b-reset");
rb.onclick=()=>{
  if(!armed){armed=true;rb.textContent="もう一度押すと消去";setTimeout(()=>{armed=false;rb.textContent="リセット"},3000);return}
  armed=false;rb.textContent="リセット";ans={};save();
  main.querySelectorAll(".opts button").forEach(x=>x.setAttribute("aria-pressed","false"));
  main.querySelectorAll(".inp input").forEach(x=>x.value="");
  document.body.classList.remove("graded","reveal");kb.setAttribute("aria-pressed","false");updProg();
};
updProg();
</script>
