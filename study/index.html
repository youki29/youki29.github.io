<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>勉強サイト一覧</title>
<meta name="description" content="高校の定期テスト・受験勉強に使える、まとめページと練習ドリルの一覧。国語・英語・地理・理科・情報。すべて無料、登録なしで使えます。">
<link rel="icon" href="../img/studylog/icon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=M+PLUS+Rounded+1c:wght@500;800&family=Zen+Kaku+Gothic+New:wght@400;700&display=swap">
<style>
:root {
  --bg: #f6f8f7; --card: #ffffff; --ink: #1d2124; --sub: #4a5257; --mute: #6b7378;
  --line: #dde3e6; --soft: #eef3f1; --accent: #2c7d67; --accent-ink: #ffffff;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #121516; --card: #1a1f21; --ink: #ebeff0; --sub: #bcc5c9; --mute: #98a2a7;
    --line: #2a3134; --soft: #20272a; --accent: #8fd6bf; --accent-ink: #10201b;
  }
}
:root[data-theme="dark"] {
  --bg: #121516; --card: #1a1f21; --ink: #ebeff0; --sub: #bcc5c9; --mute: #98a2a7;
  --line: #2a3134; --soft: #20272a; --accent: #8fd6bf; --accent-ink: #10201b;
}
* { box-sizing: border-box; }
html { -webkit-text-size-adjust: 100%; }
body { margin: 0; background: var(--bg); color: var(--ink); font: 16px/1.8 "Zen Kaku Gothic New", "Hiragino Sans", "Yu Gothic", Meiryo, sans-serif; overflow-wrap: anywhere; }
a { color: var(--accent); }
.wrap { max-width: 1080px; margin: 0 auto; padding: 0 16px; }
.round { font-family: "M PLUS Rounded 1c", "Hiragino Maru Gothic ProN", sans-serif; }

.top { border-bottom: 1px solid var(--line); background: var(--card); }
.top .wrap { display: flex; justify-content: space-between; align-items: center; height: 56px; }
.logo { font: 800 20px "M PLUS Rounded 1c", sans-serif; color: var(--ink); text-decoration: none; }
.top nav a { color: var(--sub); text-decoration: none; font-weight: 700; font-size: 14px; }

.intro { padding: 40px 16px 8px; }
.intro h1 { margin: 0 0 6px; font-size: clamp(28px, 6vw, 40px); line-height: 1.3; }
.intro p { margin: 0; color: var(--sub); }
.count { margin-top: 10px !important; font-size: 14px; color: var(--mute) !important; }

.filters { display: flex; flex-wrap: wrap; gap: 8px; padding: 20px 16px 4px; }
.chip { border: 1.5px solid var(--line); background: var(--card); color: var(--sub); border-radius: 999px; padding: 6px 14px; font: 700 14px/1.4 inherit; font-family: inherit; cursor: pointer; display: inline-flex; align-items: center; gap: 6px; }
.chip .dot { width: 9px; height: 9px; border-radius: 50%; background: var(--c, var(--accent)); }
.chip small { color: var(--mute); font-weight: 500; }
.chip[aria-pressed="true"] { background: var(--ink); border-color: var(--ink); color: var(--bg); }
.chip[aria-pressed="true"] small { color: inherit; opacity: .7; }

.group { padding: 24px 0 4px; }
.group h2 { display: flex; align-items: center; gap: 10px; margin: 0 0 12px; font-size: 22px; }
.group h2::before { content: ""; width: 6px; height: 22px; border-radius: 3px; background: var(--c); }

.grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(min(100%, 300px), 1fr)); gap: 14px; }
.card { position: relative; display: flex; flex-direction: column; background: var(--card); border: 1px solid var(--line); border-radius: 16px; padding: 18px; text-decoration: none; color: var(--ink); border-top: 4px solid var(--c); transition: transform .15s, box-shadow .15s; }
.card:hover { transform: translateY(-2px); box-shadow: 0 6px 20px rgb(0 0 0 / .08); }
.card:focus-visible { outline: 3px solid var(--accent); outline-offset: 2px; }
.card h3 { margin: 0 0 6px; font-size: 18px; line-height: 1.45; }
.card p { margin: 0 0 12px; color: var(--sub); font-size: 14px; line-height: 1.7; flex: 1; }
.meta { display: flex; flex-wrap: wrap; gap: 6px; align-items: center; }
.kind { font-size: 12px; font-weight: 700; padding: 2px 10px; border-radius: 999px; background: var(--soft); color: var(--sub); }
.new { font-size: 12px; font-weight: 800; padding: 2px 10px; border-radius: 999px; background: var(--c); color: #fff; }
.go { margin-left: auto; font-weight: 700; font-size: 14px; color: var(--accent); }

.foot { padding: 40px 16px 56px; color: var(--mute); font-size: 14px; }
.foot p { margin: 4px 0; }
</style>
</head>
<body>
<header class="top">
  <div class="wrap">
    <a class="logo" href="../">youki29</a>
    <nav><a href="../">アプリ一覧へ</a></nav>
  </div>
</header>

<main>
  <div class="wrap intro">
    <h1 class="round">勉強サイト</h1>
    <p>定期テストや受験の勉強に使える、まとめページと練習ドリルです。すべて無料・登録なしで、スマホでもそのまま使えます。</p>
    <p class="count" id="count"></p>
  </div>

  <div class="wrap filters" id="filters" role="group" aria-label="教科でしぼりこむ"></div>

  <div class="wrap" id="list"></div>
</main>

<footer class="wrap foot">
  <p>サイトは少しずつ増やしていきます。</p>
  <p>© 2026 youki29 ・ <a href="../">アプリ一覧</a></p>
</footer>

<script src="sites.js"></script>
<script>
(() => {
  const NEW_DAYS = 14;
  const now = Date.now();
  const isNew = s => s.added && (now - new Date(s.added + 'T00:00:00+09:00').getTime()) / 864e5 <= NEW_DAYS;
  const esc = t => String(t).replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
  const subj = Object.fromEntries(SUBJECTS.map(s => [s.id, s]));
  const used = SUBJECTS.filter(s => SITES.some(x => x.subject === s.id));

  let current = 'all';
  try { const h = decodeURIComponent(location.hash.slice(1)); if (subj[h]) current = h; } catch (e) {}

  const filters = document.getElementById('filters');
  const chip = (id, name, n, color) =>
    `<button class="chip" data-id="${id}" style="--c:${color || 'var(--accent)'}" aria-pressed="false">` +
    (color ? '<span class="dot"></span>' : '') + `${esc(name)} <small>${n}</small></button>`;
  filters.innerHTML = chip('all', 'すべて', SITES.length) +
    used.map(s => chip(s.id, s.name, SITES.filter(x => x.subject === s.id).length, s.color)).join('');

  const card = s => {
    const c = subj[s.subject]?.color || '#888';
    const ext = /^https?:/.test(s.url) && !s.url.startsWith('https://youki29.github.io/') ? ' target="_blank" rel="noopener"' : '';
    return `<a class="card" href="${esc(s.url)}"${ext} style="--c:${c}">
      <h3>${esc(s.title)}</h3>
      <p>${esc(s.desc)}</p>
      <div class="meta">${isNew(s) ? '<span class="new">新着</span>' : ''}${(s.kinds || []).map(k => `<span class="kind">${esc(k)}</span>`).join('')}<span class="go">ひらく →</span></div>
    </a>`;
  };

  const render = () => {
    filters.querySelectorAll('.chip').forEach(b => b.setAttribute('aria-pressed', String(b.dataset.id === current)));
    const groups = used.filter(s => current === 'all' || s.id === current);
    document.getElementById('list').innerHTML = groups.map(g => `
      <section class="group" style="--c:${g.color}">
        <h2 class="round">${esc(g.name)}</h2>
        <div class="grid">${SITES.filter(s => s.subject === g.id).map(card).join('')}</div>
      </section>`).join('');
    const n = current === 'all' ? SITES.length : SITES.filter(s => s.subject === current).length;
    document.getElementById('count').textContent = `${n} サイト`;
  };

  filters.addEventListener('click', e => {
    const b = e.target.closest('.chip');
    if (!b) return;
    current = b.dataset.id;
    history.replaceState(null, '', current === 'all' ? location.pathname : '#' + current);
    render();
  });
  render();
})();
</script>
</body>
</html>
