<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>生物基礎 練習問題（3-1〜3-5）</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Klee+One:wght@600&family=Zen+Kaku+Gothic+New:wght@400;500;700&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#D7DFE6; --surface:#EEF2F5; --text:#1F2A36; --sub:#5C6875; --line:#C3CDD6;
  --card:#FFFFFF; --card-ink:#1F2A36; --card-sub:#7A8591; --red:#D6141C;
  --ok:#1E7A4C; --ok-bg:#E3F3EA; --ng:#C0262D; --ng-bg:#FBE6E7; --on:#1F2A36; --on-text:#FFFFFF; --choice:#F6F8FA;
  color-scheme:light; box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px); padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#151A20; --surface:#222A33; --text:#E4E9EE; --sub:#9AA6B2; --line:#36414C;
  --card:#ECEEEA; --card-ink:#1F2A36; --card-sub:#6E7884; --red:#C4121A;
  --ok:#4FBF86; --ok-bg:#D6EDDF; --ng:#E0555B; --ng-bg:#F4DADB; --on:#E4E9EE; --on-text:#151A20; --choice:#E2E5E1; color-scheme:dark;}}
:root[data-theme="dark"]{
  --bg:#151A20; --surface:#222A33; --text:#E4E9EE; --sub:#9AA6B2; --line:#36414C;
  --card:#ECEEEA; --card-ink:#1F2A36; --card-sub:#6E7884; --red:#C4121A;
  --ok:#4FBF86; --ok-bg:#D6EDDF; --ng:#E0555B; --ng-bg:#F4DADB; --on:#E4E9EE; --on-text:#151A20; --choice:#E2E5E1; color-scheme:dark;}
*,*::before,*::after{box-sizing:border-box}
html{min-height:100%}
body{margin:0;min-height:100%;background:var(--bg);color:var(--text);
  font-family:"Zen Kaku Gothic New","Hiragino Kaku Gothic ProN","Noto Sans JP",sans-serif;-webkit-tap-highlight-color:transparent}
.app{max-width:560px;margin:0 auto;padding:14px 16px 28px}
h1{font-size:18px;margin:6px 0 4px}
.lead{font-size:13px;color:var(--sub);margin:0 0 16px}
.label{font-size:13px;font-weight:700;margin:16px 0 8px}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{border:1px solid var(--line);background:var(--surface);color:var(--text);font:inherit;font-size:13px;padding:7px 12px;border-radius:999px;cursor:pointer}
.chip[aria-pressed="true"]{background:var(--on);color:var(--on-text);border-color:var(--on)}
.chip small{opacity:.7}
.big{display:block;width:100%;font:inherit;font-size:16px;font-weight:700;padding:14px;border-radius:12px;border:0;background:var(--ok);color:#fff;cursor:pointer;margin-top:22px}
.big:disabled{opacity:.45;cursor:default}
.sub-btn{display:block;width:100%;font:inherit;font-size:14px;padding:12px;border-radius:12px;border:1px solid var(--line);background:var(--surface);color:var(--text);cursor:pointer;margin-top:10px}
.note{font-size:12px;color:var(--sub);margin-top:10px}
.top{display:flex;justify-content:space-between;align-items:center;font-size:13px;color:var(--sub);margin:4px 0 8px}
.top button{font:inherit;font-size:13px;border:0;background:none;color:var(--sub);cursor:pointer;padding:4px 0}
.bar{height:4px;background:var(--line);border-radius:2px;overflow:hidden;margin-bottom:14px}
.bar i{display:block;height:100%;background:var(--ok);width:0;transition:width .3s}
.sheet{background:var(--card);color:var(--card-ink);border-radius:6px;box-shadow:0 2px 6px rgba(0,0,0,.14);padding:18px 18px 16px}
.tag{font-size:12px;color:var(--card-sub)}
.q{font-size:18px;line-height:1.6;font-weight:500;margin:8px 0 16px;overflow-wrap:anywhere}
.choices{display:grid;gap:8px}
.choice{display:flex;gap:10px;align-items:flex-start;text-align:left;font:inherit;font-size:15px;line-height:1.5;padding:12px 12px;border-radius:10px;
  border:1.5px solid #D5DBE1;background:var(--choice);color:var(--card-ink);cursor:pointer}
.choice span{white-space:pre-wrap;font-family:inherit}
.choice b{flex:none;width:22px;height:22px;border-radius:50%;background:#fff;border:1px solid #C3CDD6;display:grid;place-items:center;font-size:12px}
.choice.ok{border-color:var(--ok);background:var(--ok-bg)}
.choice.ng{border-color:var(--ng);background:var(--ng-bg)}
.choice:disabled{cursor:default}
.res{margin-top:14px;padding-top:12px;border-top:1px dashed #C9CED4}
.verdict{font-weight:700;font-size:16px}
.verdict.ok{color:var(--ok)} .verdict.ng{color:var(--ng)}
.ans{font-family:"Klee One","Zen Kaku Gothic New",cursive;font-weight:600;color:var(--red);font-size:19px;margin:4px 0}
.exp{font-size:14px;line-height:1.6;color:var(--card-ink)}
.score{text-align:center;padding:10px 0 4px}
.score .num{font-size:44px;font-weight:700}
.score .num small{font-size:18px;color:var(--card-sub)}
.wrong{margin:14px 0 0;padding:0;list-style:none}
.wrong li{padding:10px 0;border-top:1px solid #DDE2E7;font-size:14px;line-height:1.55}
.wrong .ans{font-size:16px}
.gw{overflow-x:auto;margin:4px 0 10px}
.grid{border-collapse:collapse;margin:0 auto}
.grid th{font-size:11px;font-weight:500;color:var(--card-sub);padding:2px;text-align:center}
.grid td{padding:0}
.cell{width:34px;height:34px;font:inherit;font-size:17px;border:1px solid #9AA6B2;background:#fff;color:var(--card-ink);cursor:pointer;padding:0;display:block}
.cell.par{background:#DCEFD8}
.cell:disabled{cursor:default}
.cell.badline{box-shadow:inset 0 0 0 2px #E8A0A4}
.cell.hit{background:var(--ok-bg);box-shadow:inset 0 0 0 3px var(--ok);font-weight:700}
.cell.miss{background:var(--ng-bg);box-shadow:inset 0 0 0 3px var(--ng)}
.gnote{font-size:12px;color:var(--card-sub);text-align:center;margin:4px 0 0}
.noerr{display:block;margin:8px auto 0;font:inherit;font-size:14px;padding:9px 16px;border-radius:10px;border:1.5px solid #D5DBE1;background:var(--choice);color:var(--card-ink);cursor:pointer}
.noerr.ok{border-color:var(--ok);background:var(--ok-bg)} .noerr.ng{border-color:var(--ng);background:var(--ng-bg)}
@media (max-width:380px){.cell{width:30px;height:30px;font-size:15px}}
.ft{border-collapse:collapse;margin:0 auto;min-width:min(100%,320px)}
.ft th{background:#E9EDF1;font-size:13px;padding:6px 8px;border:1px solid #B9C3CC;white-space:nowrap}
.ft td{border:1px solid #B9C3CC;padding:4px;text-align:center;font-size:15px;vertical-align:top}
.ft td.fix{background:#F7F8F9;font-family:ui-monospace,Menlo,Consolas,monospace;white-space:nowrap;padding:8px}
.fin{width:64px;font:inherit;font-size:16px;text-align:center;padding:6px 4px;border:1.5px solid #B9C3CC;border-radius:6px;background:#fff;color:var(--card-ink)}
.tog{min-width:48px;padding:0 8px;height:38px;font:inherit;font-size:17px;font-weight:700;border:1.5px solid #B9C3CC;border-radius:6px;background:#fff;color:var(--card-ink);cursor:pointer}
.ft td.good{background:var(--ok-bg)} .ft td.bad{background:var(--ng-bg)}
.fix-ans{font-family:"Klee One","Zen Kaku Gothic New",cursive;font-weight:600;color:var(--red);font-size:16px;margin-top:2px}
pre.code{margin:0 0 12px;background:#F3F5F7;border:1px solid #D5DBE1;border-radius:8px;padding:10px 12px;overflow-x:auto;
  font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,"Noto Sans Mono",monospace;font-size:14px;line-height:1.6;color:var(--card-ink)}
[hidden]{display:none!important}
button:focus-visible{outline:3px solid #3A7BD5;outline-offset:2px}
@media (prefers-reduced-motion:reduce){.bar i{transition:none}}
</style>
</head>
<body>
<div class="app">
  <section id="start">
    <h1>生物基礎 練習問題</h1>
    <p class="lead">3-1〜3-5（ヒトの体内環境の維持）から出題します。4択（一部2択）と、表を完成させる問題があります。答えるとすぐに解説が出ます。</p>
    <div class="label">範囲（複数選べます）</div>
    <div class="chips" id="lessons"></div>
    <div class="label">問題数</div>
    <div class="chips" id="counts"></div>
    <div class="label">出題する問題</div>
    <div class="chips" id="pool"></div>
    <button class="big" id="go">はじめる</button>
    <p class="note" id="info"></p>
  </section>

  <section id="quiz" hidden>
    <div class="top"><span id="pos"></span><button id="quit">やめる</button></div>
    <div class="bar"><i id="fill"></i></div>
    <div class="sheet">
      <div class="tag" id="tag"></div>
      <div class="q" id="qtext"></div>
      <div class="choices" id="choices"></div>
      <div class="res" id="res" hidden>
        <div class="verdict" id="verdict"></div>
        <div class="ans" id="right"></div>
        <div class="exp" id="exp"></div>
      </div>
    </div>
    <button class="big" id="next" hidden>次へ</button>
  </section>

  <section id="result" hidden>
    <div class="sheet">
      <div class="score"><div class="tag">結果</div><div class="num" id="score"></div><div class="tag" id="comment"></div></div>
      <ul class="wrong" id="wrongList"></ul>
    </div>
    <button class="big" id="retry">間違えた問題をもう一度</button>
    <button class="sub-btn" id="home">最初の画面に戻る</button>
  </section>
</div>
<script>
const Q=[
[1,"体内環境を一定の範囲に保つ性質を何という？",["恒常性（ホメオスタシス）","体内環境","神経分泌","フィードバック"],0,"自律神経系と内分泌系によって調節されている。"],
[1,"血しょうが毛細血管からしみ出し、組織の細胞を取り巻く体液は？",["組織液","血液","リンパ液","原尿"],0,"組織液の一部がリンパ管に入るとリンパ液になる。"],
[1,"リンパ管が合流する血管は？",["鎖骨下静脈","大動脈","肝門脈","肺静脈"],0,"リンパ液は鎖骨下静脈で血液に戻る。"],
[1,"中枢神経系はどれ？",["脳と脊髄","交感神経と副交感神経","感覚神経と運動神経","脳と心臓"],0,"それ以外の神経は末梢神経系。"],
[1,"体性神経系に含まれるものは？",["感覚神経・運動神経","交感神経・副交感神経","脳・脊髄","視床下部・脳下垂体"],0,"自律神経系は交感神経・副交感神経。"],
[1,"意識や思考などの中枢は？",["大脳","小脳","延髄","間脳"],0,"大脳の機能だけが失われた状態を植物状態という。"],
[1,"生命維持の中枢である「脳幹」に含まれないものは？",["大脳","間脳","中脳","延髄"],0,"脳幹は間脳・中脳・延髄。"],
[1,"自律神経系の総合的な中枢は？",["間脳の視床下部","大脳","小脳","延髄"],0,"自律神経系は意思とは無関係に働く。"],
[1,"興奮状態で働きが優位になる神経は？",["交感神経","副交感神経","運動神経","感覚神経"],0,"リラックス状態で優位になるのは副交感神経。"],
[1,"交感神経の中枢神経系からの出どころは？",["脊髄","中脳","延髄","大脳"],0,"副交感神経は中脳・延髄・脊髄の尾部から出る。"],
[1,"交感神経が働くと、瞳孔はどうなる？",["拡大する","縮小する","変わらない"],0,"副交感神経では縮小する。"],
[1,"副交感神経が働くと、消化管の運動はどうなる？",["促進される","抑制される","変わらない"],0,"交感神経では抑制される。"],
[1,"汗腺・立毛筋・体表の血管に分布している自律神経は？",["交感神経だけ","副交感神経だけ","両方","どちらも分布していない"],0,"副交感神経は分布していない。"],
[1,"交感神経と副交感神経の、器官での働きの関係は？",["反対で、互いに拮抗的に作用する","同じ働きをする","交感神経だけが働く","順番に働く"],0,"同じ器官に分布していることが多く、働きは反対。"],
[1,"心臓が自発的に拍動するための部位は？",["ペースメーカー（洞房結節）","視床下部","ランゲルハンス島","ネフロン"],0,"右心房と大静脈の境界付近にある。"],
[1,"心臓の拍動の中枢は？",["延髄","大脳","小脳","間脳"],0,"自律神経系がペースメーカーに作用して拍動を調節する。"],
[1,"「感動して鳥肌が立つ」とき、優位に働いている神経は？",["交感神経","副交感神経","当てはまらない（×）"],0,"立毛筋の収縮は交感神経の働き。"],
[1,"「肩をまわす」はどれに当てはまる？",["当てはまらない（×）","交感神経","副交感神経"],0,"自分の意思で動かすので、自律神経ではなく体性神経（運動神経）の働き。"],

[2,"排出管を通して体外に化学物質を放出する腺は？",["外分泌腺","内分泌腺","ランゲルハンス島","副腎"],0,"汗や消化液を出す。"],
[2,"内分泌腺から血液中に放出される物質は？",["ホルモン","消化液","汗","胆汁"],0,"血液の循環で全身に送られる。"],
[2,"ホルモンが作用する特定の細胞を何という？",["標的細胞","腺細胞","神経分泌細胞","造血幹細胞"],0,"特定のホルモンと結合する受容体をもつ。"],
[2,"自律神経系と比べたホルモンの特徴は？",["効果が現れるまで時間はかかるが、作用に持続性がある","すぐに効くが、すぐに終わる","全身のどの細胞にも作用する","大量に必要"],0,"ホルモンは微量で作用する。"],
[2,"ホルモン分泌の総合的な中枢は？",["間脳の視床下部","脳下垂体後葉","甲状腺","副腎皮質"],0,"脳の神経細胞がホルモンを分泌する現象を神経分泌という。"],
[2,"脳下垂体後葉から分泌され、腎臓の集合管で水の再吸収を促進するホルモンは？",["バソプレシン","チロキシン","成長ホルモン","パラトルモン"],0,"血圧を上げる働きもある。"],
[2,"甲状腺から分泌され、代謝を促進するホルモンは？",["チロキシン","インスリン","アドレナリン","グルカゴン"],0,"体温を上げる調節にもかかわる。"],
[2,"血液中のCa²⁺濃度を上昇させるホルモンと分泌する腺は？",["パラトルモン・副甲状腺","チロキシン・甲状腺","インスリン・すい臓","アドレナリン・副腎髄質"],0,"血液凝固にもかかわる。"],
[2,"副腎髄質から分泌され、交感神経の作用を強めるホルモンは？",["アドレナリン","糖質コルチコイド","鉱質コルチコイド","グルカゴン"],0,"グリコーゲンを分解して血糖濃度を上げる。"],
[2,"体液中のNa⁺やK⁺の濃度を調節するホルモンは？",["鉱質コルチコイド","糖質コルチコイド","バソプレシン","インスリン"],0,"副腎皮質から分泌される。"],
[2,"血糖濃度を下げる唯一のホルモンは？",["インスリン","グルカゴン","アドレナリン","成長ホルモン"],0,"ランゲルハンス島B細胞から分泌される。"],
[2,"グルカゴンを分泌するのは？",["ランゲルハンス島A細胞","ランゲルハンス島B細胞","副腎髄質","脳下垂体前葉"],0,"グリコーゲンを分解して血糖濃度を上げる。"],
[2,"副腎の内側と外側の名称は？",["内側：髄質／外側：皮質","内側：皮質／外側：髄質","内側：前葉／外側：後葉"],0,"髄質からアドレナリン、皮質から糖質コルチコイド・鉱質コルチコイド。"],

[3,"結果を反対の方向に進めて調節するしくみは？",["負のフィードバック","正のフィードバック","神経分泌","拮抗作用"],0,"結果が原因にさかのぼって作用することをフィードバックという。"],
[3,"チロキシンが不足したとき、脳下垂体前葉から分泌が増えるホルモンは？",["甲状腺刺激ホルモン","バソプレシン","副腎皮質刺激ホルモン","パラトルモン"],0,"視床下部 → 甲状腺刺激ホルモン放出ホルモン → 脳下垂体前葉 → 甲状腺刺激ホルモン → 甲状腺。"],
[3,"チロキシンが増えすぎると、視床下部や脳下垂体の分泌はどうなる？",["抑えられる","さらに増える","変わらない"],0,"負のフィードバックで一定に保たれる。"],
[3,"空腹時の血糖濃度の正常値は？",["血液100mL中に約100mg（約0.1%）","血液100mL中に約10mg","血液100mL中に約1g","約1%"],0,"血糖とは血液中のグルコースのこと。"],
[3,"小腸などで吸収したグルコースを含む血液を肝臓へ運ぶ血管は？",["肝門脈","肝動脈","肝静脈","大静脈"],0,"肝動脈は心臓から肝臓へ、肝静脈は肝臓から心臓へ。"],
[3,"高血糖時、情報を伝える自律神経は？",["副交感神経","交感神経","運動神経"],0,"副交感神経 → ランゲルハンス島B細胞 → インスリン。"],
[3,"低血糖時、情報を伝える自律神経は？",["交感神経","副交感神経","感覚神経"],0,"交感神経 → 副腎髄質（アドレナリン）・A細胞（グルカゴン）。"],
[3,"インスリンが血糖濃度を下げる方法は？",["肝臓でグリコーゲンを合成し、細胞でグルコースの消費を促進","肝臓でグリコーゲンを分解","タンパク質から糖をつくる","尿にグルコースを出す"],0,"アドレナリン・グルカゴンはグリコーゲンを分解して血糖濃度を上げる。"],
[3,"極度の低血糖時に副腎皮質から分泌され、タンパク質を糖に変えるホルモンは？",["糖質コルチコイド","鉱質コルチコイド","アドレナリン","チロキシン"],0,"脳下垂体前葉の副腎皮質刺激ホルモンで分泌が促進される。"],
[3,"肝臓の基本単位は？",["肝小葉","ネフロン","腎小体","ランゲルハンス島"],0,"約50万個の肝細胞からなる。"],
[3,"タンパク質の分解で生じる有害なアンモニアを、肝臓は何に変える？",["尿素","グルコース","胆汁","グリコーゲン"],0,"尿素は腎臓で尿の主成分となって体外へ出る。"],
[3,"肝臓でつくられる胆汁の働きは？",["十二指腸へ分泌され、脂肪の消化を助ける","血糖濃度を下げる","血液を固める","酸素を運ぶ"],0,"胆管を通って胆のうに蓄えられる。"],

function makeGrid(par){
  // 7文字×7bit（列が文字）＋右にパリティ列・下にパリティ行
  const g=[];for(let r=0;r<7;r++){g.push([]);for(let c=0;c<7;c++)g[r].push(Math.random()<0.5?1:0);}
  const fix=n=>par==="even"?n%2:(n+1)%2;
  for(let r=0;r<7;r++)g[r].push(fix(g[r].reduce((a,b)=>a+b,0)));
  const last=[];for(let c=0;c<8;c++){let s=0;for(let r=0;r<7;r++)s+=g[r][c];last.push(fix(s));}
  g.push(last);
  let err=null;
  if(Math.random()<0.8){const r=Math.floor(Math.random()*7),c=Math.floor(Math.random()*7);g[r][c]^=1;err={r,c,orig:g[r][c]^1};}
  return {g,err};
}
function badLines(g,par){
  const want=par==="even"?0:1, rows=[],cols=[];
  for(let r=0;r<8;r++){if(r===7)continue;const s=g[r].reduce((a,b)=>a+b,0);if(s%2!==want)rows.push(r);}
  for(let c=0;c<8;c++){if(c===7)continue;let s=0;for(let r=0;r<8;r++)s+=g[r][c];if(s%2!==want)cols.push(c);}
  return {rows,cols};
}

  }else{
    $("right").textContent="正解：誤りなし";
    $("exp").textContent="すべての行と列で、1の数が"+pw+"になっているので、正しく受信できている。";
  }
  $("res").hidden=false;$("next").hidden=false;
  $("next").textContent=pos+1<set.length?"次へ":"結果を見る";
  $("next").focus({preventScroll:true});
  $("res").scrollIntoView({block:"nearest",behavior:"smooth"});
}
function answer(ci,btn){
  const it=set[pos], ok=ci===it.a;
  document.querySelectorAll(".choice").forEach(b=>{b.disabled=true;if(+b.dataset.ci===it.a)b.classList.add("ok");});
  if(!ok)btn.classList.add("ng");
  if(ok){correct++;missed.delete(it.id);}else{missed.add(it.id);wrongNow.push(it);}
  save();
  $("verdict").textContent=ok?"正解！":"ざんねん…";
  $("verdict").className="verdict "+(ok?"ok":"ng");
  $("right").textContent="正解："+it.c[it.a];
  $("exp").textContent=it.e;
  $("res").hidden=false;$("next").hidden=false;
  $("next").textContent=pos+1<set.length?"次へ":"結果を見る";
  $("next").focus({preventScroll:true});
  $("res").scrollIntoView({block:"nearest",behavior:"smooth"});
}
$("next").onclick=()=>{pos++;if(pos<set.length)render();else finish();};
$("quit").onclick=()=>{syncStart();show("start");};
function finish(){
  $("fill").style.width="100%";
  show("result");
  $("score").innerHTML=correct+"<small> / "+set.length+"</small>";
  const r=correct/set.length;
  $("comment").textContent=r===1?"全問正解！すごい！":r>=0.8?"よくできました！":r>=0.5?"あと少し！間違えた問題を見直そう":"まとめを見直してから、もう一度やってみよう";
  const ul=$("wrongList");ul.innerHTML="";
  wrongNow.forEach(it=>{const li=document.createElement("li");
    const q=document.createElement("div");q.textContent=LBL(it.l)+"："+it.q;
    const a=document.createElement("div");a.className="ans";a.textContent=it.c[it.a];
    li.append(q,a);ul.appendChild(li);});
  $("retry").hidden=wrongNow.length===0;
}
$("retry").onclick=()=>begin(shuffle(wrongNow));
$("home").onclick=()=>{syncStart();show("start");};
syncStart();
</script>
</body>
</html>
